<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Tréló</title>
</head>
<body>
    <header>
        <h1>Projectmunka nyilvántartó</h1>
        <input type="text" name="" id="taskInput" placeholder="Új feladat">
        <input type="button" value="Hozzáadás" id="addButton">
    </header>
    <main>
        <div>
            <h1>Teendő</h1>
            <div id="toDo"></div>
        </div>
        <div>
            <h1>Folyamatban</h1>
            <div id="inProgress"></div>
        </div>
        <div>
            <h1>Kész</h1>
            <div id="done"></div>
        </div>
    </main>
</body>
</html>
